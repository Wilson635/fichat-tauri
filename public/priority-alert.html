<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message prioritaire — FiEcho</title>
  <style>
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/fonts/poppins-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/fonts/poppins-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/poppins-700.woff2") format("woff2");
    }
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --surface: #1E293B;
      --surface-2: #273449;
      --border: #2A3648;
      --border-strong: #3D4B60;
      --text: #F1F5F9;
      --text-2: #CBD5E1;
      --muted: #94A3B8;
      --scrim: #020617;
      --well-bg: rgba(239, 68, 68, 0.16);
      --well-fg: #f87171;
      --ghost-bg: transparent;
      --ghost-fg: #CBD5E1;
      --shadow: 0 28px 64px -18px rgba(0, 0, 0, 0.55);
    }
    [data-theme="light"] {
      color-scheme: light;
      --surface: #ffffff;
      --surface-2: #F6F7F9;
      --border: #E6E8EC;
      --border-strong: #D0D5DD;
      --text: #0F172A;
      --text-2: #334155;
      --muted: #64748B;
      --scrim: #475569;
      --well-bg: rgba(220, 38, 38, 0.12);
      --well-fg: #dc2626;
      --ghost-bg: #ffffff;
      --ghost-fg: #334155;
      --shadow: 0 28px 64px -18px rgba(15, 23, 42, 0.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--surface);
      font-family: "Poppins", "Segoe UI", sans-serif;
      user-select: none;
      color: var(--text);
    }
    .scrim, .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .card {
      width: 100%;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      background: var(--surface);
      border: 0;
      box-shadow: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 0;
    }
    .well {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--well-bg);
      color: var(--well-fg);
    }
    .well svg { width: 22px; height: 22px; }
    .kicker {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--well-fg);
      background: var(--well-bg);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .brand {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .content { padding: 16px 18px 8px; flex: 1; }
    .conv {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }
    .sender {
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .msg {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 10px;
      padding: 8px 18px 10px;
    }
    button {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ghost {
      background: var(--ghost-bg);
      border: 1px solid var(--border-strong);
      color: var(--ghost-fg);
    }
    .ghost:hover { filter: brightness(0.97); }
    [data-theme="dark"] .ghost:hover { background: rgba(255, 255, 255, 0.06); }
    .primary {
      border: 0;
      background: #00a884;
      color: #fff;
    }
    .primary:hover { background: #009878; }
    button:focus-visible {
      outline: 2px solid #00a884;
      outline-offset: 2px;
    }
    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 0 18px 16px;
    }
  </style>
  <script>
    (function () {
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div class="scrim">
    <div class="stage" id="stage">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="prio-title">
      <div class="head">
        <div class="well" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
        </div>
        <div>
          <span class="kicker">Message prioritaire</span>
          <p class="brand" id="prio-title">FiEcho</p>
        </div>
      </div>
      <div class="content">
        <p class="conv" id="conv">Conversation</p>
        <p class="sender" id="sender"></p>
        <div class="msg" id="body">Chargement…</div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="btn-close">Ignorer</button>
        <button type="button" class="primary" id="btn-open">Ouvrir la conversation</button>
      </div>
      <p class="hint" id="hint">Entrée pour ouvrir · Échap pour ignorer</p>
    </div>
    </div>
  </div>
  <script>
    let payload = { title: "FiEcho", body: "", conversationId: null, theme: null };
    let armed = false;
    document.documentElement.style.pointerEvents = "none";
    setTimeout(function () {
      armed = true;
      document.documentElement.style.pointerEvents = "";
      const openBtn = document.getElementById("btn-open");
      if (hasConversation(payload) && openBtn && openBtn.style.display !== "none") {
        openBtn.focus();
      }
    }, 900);

    function applyTheme(theme) {
      const t = theme === "light" || theme === "dark" ? theme : null;
      if (!t) return;
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.colorScheme = t;
    }

    function splitBody(raw) {
      const text = String(raw || "");
      const i = text.indexOf(": ");
      if (i > 0 && i < 80) {
        return { sender: text.slice(0, i), content: text.slice(i + 2) };
      }
      return { sender: "", content: text };
    }

    function applyStage(stage) {
      const el = document.getElementById("stage");
      if (!el || !stage) return;
      const left = Number(stage.left);
      const top = Number(stage.top);
      const width = Number(stage.width);
      const height = Number(stage.height);
      if (![left, top, width, height].every(Number.isFinite)) return;
      el.style.left = left + "%";
      el.style.top = top + "%";
      el.style.width = Math.max(width, 1) + "%";
      el.style.height = Math.max(height, 1) + "%";
    }

    function hasConversation(data) {
      const id = data && data.conversationId;
      return typeof id === "number" && id > 0;
    }

    function render(data) {
      if (!data) return;
      payload = data;
      applyTheme(data.theme);
      applyStage(data.stage);
      document.getElementById("conv").textContent = data.title || "Conversation";
      const parts = splitBody(data.body);
      const senderEl = document.getElementById("sender");
      senderEl.textContent = parts.sender;
      senderEl.style.display = parts.sender ? "" : "none";
      document.getElementById("body").textContent = parts.content || data.body || "";
      const openBtn = document.getElementById("btn-open");
      const closeBtn = document.getElementById("btn-close");
      const hint = document.getElementById("hint");
      if (hasConversation(data)) {
        openBtn.style.display = "";
        closeBtn.textContent = "Ignorer";
        hint.textContent = "Entrée pour ouvrir · Échap pour ignorer";
      } else {
        openBtn.style.display = "none";
        closeBtn.textContent = "J'ai compris";
        hint.textContent = "Entrée ou Échap pour fermer";
      }
      if (armed && hasConversation(data)) {
        openBtn.focus();
      }
    }

    function getTauri() {
      return window.__TAURI__ || null;
    }

    function currentWindow(t) {
      if (!t) return null;
      if (t.webviewWindow?.getCurrentWebviewWindow) return t.webviewWindow.getCurrentWebviewWindow();
      if (t.webviewWindow?.getCurrent) return t.webviewWindow.getCurrent();
      if (t.window?.getCurrentWindow) return t.window.getCurrentWindow();
      if (t.window?.getCurrent) return t.window.getCurrent();
      return null;
    }

    async function respond(action) {
      if (!armed) return;
      const data = {
        action,
        conversationId: payload.conversationId ?? null,
      };
      try {
        const t = getTauri();
        const win = currentWindow(t);
        if (win?.emit) await win.emit("priority-respond", data);
        else if (t?.event?.emit) await t.event.emit("priority-respond", data);
        if (win?.close) await win.close();
        else window.close();
      } catch (e) {
        try { window.close(); } catch (_) {}
      }
    }

    function swallowIfLocked(e) {
      if (armed) return;
      e.preventDefault();
      e.stopPropagation();
    }
    document.addEventListener("pointerdown", swallowIfLocked, true);
    document.addEventListener("pointerup", swallowIfLocked, true);
    document.addEventListener("mousedown", swallowIfLocked, true);
    document.addEventListener("mouseup", swallowIfLocked, true);
    document.addEventListener("click", swallowIfLocked, true);
    document.getElementById("btn-close").addEventListener("click", () => respond("dismiss"));
    document.getElementById("btn-open").addEventListener("click", () => respond("open"));
    window.addEventListener("keydown", (e) => {
      if (!armed) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (e.key === "Escape") respond("dismiss");
      if (e.key === "Enter") respond(hasConversation(payload) ? "open" : "dismiss");
    });
    window.addEventListener("fichat-priority", () => {
      applyTheme(window.__FICHAT_THEME__);
      applyStage(window.__FICHAT_STAGE__);
      render(Object.assign({}, window.__FICHAT_PRIORITY__ || {}, { theme: window.__FICHAT_THEME__ }));
    });

    (async function boot() {
      applyTheme(window.__FICHAT_THEME__);
      applyStage(window.__FICHAT_STAGE__);
      if (window.__FICHAT_PRIORITY__) {
        render(Object.assign({}, window.__FICHAT_PRIORITY__, { theme: window.__FICHAT_THEME__ }));
      }
      try {
        const t = getTauri();
        if (t?.event?.listen) {
          await t.event.listen("priority-payload", (e) => render(e.payload));
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
