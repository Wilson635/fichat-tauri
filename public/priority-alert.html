<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contrôle de compte FiChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Segoe UI Variable", Tahoma, sans-serif;
      user-select: none;
    }
    body {
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(520px, calc(100vw - 48px));
      background: #f3f3f3;
      color: #1a1a1a;
      border: 1px solid #0078d4;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }
    .banner {
      background: linear-gradient(180deg, #0078d4 0%, #005a9e 100%);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .shield {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .banner h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .banner p {
      font-size: 12px;
      opacity: 0.92;
      margin-top: 2px;
    }
    .body {
      padding: 22px 22px 10px;
      background: #fff;
    }
    .question {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1b1b1b;
    }
    .meta {
      font-size: 12.5px;
      color: #444;
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .meta strong { color: #111; }
    .msg {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-left: 4px solid #d13438;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #222;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint {
      font-size: 11.5px;
      color: #666;
      margin-top: 12px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 18px 18px;
      background: #f3f3f3;
      border-top: 1px solid #e1e1e1;
    }
    button {
      min-width: 108px;
      height: 32px;
      padding: 0 16px;
      font-size: 13px;
      font-family: inherit;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid #8a8a8a;
      color: #1a1a1a;
    }
    .btn-secondary:hover { background: #f6f6f6; }
    .btn-primary {
      background: #0078d4;
      border: 1px solid #005a9e;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #006cbd; }
    .btn-primary:focus, .btn-secondary:focus {
      outline: 2px solid #005a9e;
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="uac-title">
    <div class="banner">
      <svg class="shield" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#f7d354" d="M24 4l16 6v12c0 11.2-7.1 21.3-16 24C15.1 43.3 8 33.2 8 22V10l16-6z"/>
        <path fill="#1b6ec2" d="M24 10.5l10 3.6V22c0 7.4-4.5 14.3-10 16.6-5.5-2.3-10-9.2-10-16.6v-7.9l10-3.6z"/>
        <path fill="#fff" d="M22.2 29.4l-5.1-5.1 1.8-1.8 3.3 3.3 8-8 1.8 1.8z"/>
      </svg>
      <div>
        <h1 id="uac-title">Contrôle de compte utilisateur</h1>
        <p>FiChat demande votre attention</p>
      </div>
    </div>
    <div class="body">
      <p class="question">Voulez-vous consulter ce message prioritaire ?</p>
      <p class="meta">
        Programme : <strong>FiChat</strong><br />
        Éditeur : <strong>First Trust</strong><br />
        Conversation : <strong id="conv">…</strong>
      </p>
      <div class="msg" id="body">Chargement…</div>
      <p class="hint">Cette fenêtre reste au premier plan et bloque l’écran jusqu’à votre confirmation.</p>
    </div>
    <div class="actions">
      <button type="button" class="btn-secondary" id="btn-close">Non</button>
      <button type="button" class="btn-primary" id="btn-open">Oui</button>
    </div>
  </div>
  <script>
    let payload = { title: "FiChat", body: "", conversationId: null };

    function render(data) {
      if (!data) return;
      payload = data;
      document.getElementById("conv").textContent = data.title || "Conversation";
      document.getElementById("body").textContent = data.body || "";
      document.getElementById("btn-open").focus();
    }

    function getTauri() {
      return window.__TAURI__ || null;
    }

    async function respond(action) {
      const data = {
        action,
        conversationId: payload.conversationId ?? null,
      };
      try {
        const t = getTauri();
        if (t?.window?.getCurrentWindow) {
          await t.window.getCurrentWindow().emit("priority-respond", data);
        } else if (t?.event?.emit) {
          await t.event.emit("priority-respond", data);
        }
        if (t?.window?.getCurrentWindow) {
          await t.window.getCurrentWindow().close();
        } else if (t?.webviewWindow?.getCurrent) {
          await t.webviewWindow.getCurrent().close();
        } else {
          window.close();
        }
      } catch (e) {
        try { window.close(); } catch (_) {}
      }
    }

    document.getElementById("btn-close").addEventListener("click", () => respond("dismiss"));
    document.getElementById("btn-open").addEventListener("click", () => respond("open"));
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") respond("dismiss");
      if (e.key === "Enter") respond("open");
    });
    window.addEventListener("fichat-priority", () => render(window.__FICHAT_PRIORITY__));

    (async function boot() {
      if (window.__FICHAT_PRIORITY__) render(window.__FICHAT_PRIORITY__);
      try {
        const t = getTauri();
        if (t?.event?.listen) {
          await t.event.listen("priority-payload", (e) => render(e.payload));
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
