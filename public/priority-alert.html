<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message prioritaire — FiChat</title>
  <style>
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/fonts/poppins-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/fonts/poppins-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/poppins-700.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Poppins", "Segoe UI", sans-serif;
      user-select: none;
    }
    .scrim {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(11, 18, 32, 0.22);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
    }
    .card {
      width: min(440px, calc(100vw - 48px));
      border-radius: 20px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 28px 64px -18px rgba(15, 23, 42, 0.55);
      color: #f1f5f9;
      animation: rise 0.22s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 0;
    }
    .well {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
    }
    .well svg { width: 22px; height: 22px; }
    .kicker {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f87171;
      background: rgba(239, 68, 68, 0.16);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .brand {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .content { padding: 16px 18px 8px; }
    .conv {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }
    .sender {
      margin-top: 2px;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .msg {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13.5px;
      line-height: 1.5;
      color: #f8fafc;
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 10px;
      padding: 8px 18px 10px;
    }
    button {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ghost {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
    }
    .ghost:hover { background: rgba(255, 255, 255, 0.12); }
    .primary {
      border: 0;
      background: #00a884;
      color: #fff;
    }
    .primary:hover { background: #009878; }
    button:focus-visible {
      outline: 2px solid #00a884;
      outline-offset: 2px;
    }
    .hint {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      padding: 0 18px 16px;
    }
  </style>
</head>
<body>
  <div class="scrim">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="prio-title">
      <div class="head">
        <div class="well" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
        </div>
        <div>
          <span class="kicker">Message prioritaire</span>
          <p class="brand" id="prio-title">FiChat</p>
        </div>
      </div>
      <div class="content">
        <p class="conv" id="conv">Conversation</p>
        <p class="sender" id="sender"></p>
        <div class="msg" id="body">Chargement…</div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="btn-close">Ignorer</button>
        <button type="button" class="primary" id="btn-open">Ouvrir la conversation</button>
      </div>
      <p class="hint">Entrée pour ouvrir · Échap pour ignorer</p>
    </div>
  </div>
  <script>
    let payload = { title: "FiChat", body: "", conversationId: null };

    function splitBody(raw) {
      const text = String(raw || "");
      const i = text.indexOf(": ");
      if (i > 0 && i < 80) {
        return { sender: text.slice(0, i), content: text.slice(i + 2) };
      }
      return { sender: "", content: text };
    }

    function render(data) {
      if (!data) return;
      payload = data;
      document.getElementById("conv").textContent = data.title || "Conversation";
      const parts = splitBody(data.body);
      const senderEl = document.getElementById("sender");
      senderEl.textContent = parts.sender;
      senderEl.style.display = parts.sender ? "" : "none";
      document.getElementById("body").textContent = parts.content || data.body || "";
      document.getElementById("btn-open").focus();
    }

    function getTauri() {
      return window.__TAURI__ || null;
    }

    async function respond(action) {
      const data = {
        action,
        conversationId: payload.conversationId ?? null,
      };
      try {
        const t = getTauri();
        if (t?.window?.getCurrentWindow) {
          await t.window.getCurrentWindow().emit("priority-respond", data);
        } else if (t?.event?.emit) {
          await t.event.emit("priority-respond", data);
        }
        if (t?.window?.getCurrentWindow) {
          await t.window.getCurrentWindow().close();
        } else if (t?.webviewWindow?.getCurrent) {
          await t.webviewWindow.getCurrent().close();
        } else {
          window.close();
        }
      } catch (e) {
        try { window.close(); } catch (_) {}
      }
    }

    document.getElementById("btn-close").addEventListener("click", () => respond("dismiss"));
    document.getElementById("btn-open").addEventListener("click", () => respond("open"));
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") respond("dismiss");
      if (e.key === "Enter") respond("open");
    });
    window.addEventListener("fichat-priority", () => render(window.__FICHAT_PRIORITY__));

    (async function boot() {
      if (window.__FICHAT_PRIORITY__) render(window.__FICHAT_PRIORITY__);
      try {
        const t = getTauri();
        if (t?.event?.listen) {
          await t.event.listen("priority-payload", (e) => render(e.payload));
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
